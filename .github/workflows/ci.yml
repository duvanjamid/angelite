name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  quality:
    name: coverage and bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Coverage (fails below the thresholds in package.json)
        run: npm run test:coverage
      - name: Type definitions (tsc against types/check.ts)
        run: npm run typecheck
      - name: Bundle size budgets
        run: npm run size
      - name: App size budgets (what users ship)
        run: npm run size:apps
      - name: Audit runtime dependencies (the package has none)
        run: npm audit --omit=dev --audit-level=high
