<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AngeLite UI · Componentes</title>
<style>
  :root { --bg:#fff; --fg:#1d2330; --muted:#5d667a; --line:#e3e6ee; --accent:#d6336c; --code-bg:#f6f7fb; --demo-bg:#fbfbfd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161d; --fg:#e8eaf1; --muted:#98a1b6; --line:#2a2e3b; --accent:#ff6b9a; --code-bg:#1b1e28; --demo-bg:#181b24; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .layout { display:grid; grid-template-columns:220px minmax(0,1fr); max-width:1080px; margin:0 auto; }
  aside { position:sticky; top:0; align-self:start; height:100vh; overflow:auto; padding:28px 16px; border-right:1px solid var(--line); font-size:.93rem; }
  aside .brand { font-weight:800; font-size:1.1rem; margin-bottom:14px; display:block; text-decoration:none; color:var(--fg); }
  aside .grp { margin:16px 0 4px; font-size:.72rem; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
  aside a { display:block; padding:2px 0; color:var(--fg); text-decoration:none; } aside a:hover { color:var(--accent); }
  .accent { color:var(--accent); }
  main { padding:40px 28px 96px; min-width:0; }
  h1 { font-size:2rem; margin:0 0 6px; } .lead { color:var(--muted); font-size:1.1rem; }
  h2.group { margin:52px 0 0; padding-top:14px; border-top:1px solid var(--line); font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  section { padding-top:10px; } h3 { margin:26px 0 2px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  h3 .ui-badge { font:400 .72rem ui-monospace,Menlo,monospace; }
  p { margin:6px 0 12px; } a { color:var(--accent); } .small { color:var(--muted); font-size:.85rem; }
  code { font:.9em ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--code-bg); padding:1px 5px; border-radius:4px; }
  pre { margin:0; padding:14px 16px; overflow-x:auto; background:var(--code-bg); font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; }
  pre.plain { border-radius:8px; } pre code { background:none; padding:0; font-size:inherit; }
  .example { border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:10px 0 12px; }
  .example .demo { padding:16px; background:var(--demo-bg); }
  .example .bar { padding:4px 10px; background:var(--code-bg); border-top:1px solid var(--line); }
  .note { border-left:3px solid var(--accent); padding:2px 14px; color:var(--muted); margin:14px 0; }
  .ui-table { font-size:.88rem; } .ui-table th { cursor:default; }
  @media (max-width:760px) { .layout { grid-template-columns:1fr; } aside { position:static; height:auto; border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<div id="app"><noscript>Esta página es una app de AngeLite y necesita JavaScript.</noscript></div>
<script src="angelite-lite.min.js"></script>
<script src="angelite-ui.min.js"></script>
<script src="components-data.js"></script>
<script src="components-app.js"></script>
</body>
</html>
